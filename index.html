<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAI Master - Play & Download</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 15px; color: #38bdf8; }
        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block; color: #94a3b8; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 15px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-bottom: 15px; padding: 10px; border-radius: 6px; background: #334155; font-size: 13px; text-align: center; }
        .gallery { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #0f172a; border-radius: 8px; padding: 12px; border: 1px solid #334155; }
        .card-header { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 8px; }
        .media-box { width: 100%; height: 260px; background: #000; border-radius: 6px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .media-box img { width: 100%; height: 100%; object-fit: cover; }
        .playing img { animation: cinematicZoom 4s infinite alternate linear; }
        @keyframes cinematicZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .action-btns button { padding: 8px; font-size: 12px; }
        .dl-btn { background: #16a34a !important; }
        .dl-btn:hover { background: #15803d !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>CineAI Master 🎬</h1>
    
    <label for="prompts">मूवी प्रॉम्ट्स लिखें:</label>
    <textarea id="prompts" placeholder="Shot 1: Neon rain alley Laila fighting&#10;Shot 2: Explosion and smoke screen..."></textarea>

    <div class="btn-group">
        <button id="startBtn" onclick="startMovieAutomation()">मूवी जनरेट करें</button>
        <button id="stopBtn" onclick="stopMovie()" disabled style="background:#dc2626;">रोकें</button>
    </div>

    <div class="status" id="statusText">रेडी - प्रॉम्ट डालकर जनरेट करें</div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    let isRunning = false;

    async function startMovieAutomation() {
        const text = document.getElementById('prompts').value.trim();
        if (!text) {
            alert('कृपया कम से कम एक प्रॉम्ट दर्ज करें!');
            return;
        }

        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length === 0) return;

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        for (let i = 0; i < lines.length; i++) {
            if (!isRunning) break;

            const promptText = lines[i].trim();
            updateStatus(`रेंडर हो रहा है: Scene ${i + 1} of ${lines.length}`);

            const seed = Math.floor(Math.random() * 999999);
            const mediaUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText + ", cinematic action scene, high motion, 4k")}?seed=${seed}&width=1280&height=720&nologo=true`;

            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="card-header">Scene ${i + 1}: ${promptText}</div>
                <div class="media-box playing" id="box-${i}">
                    <img src="${mediaUrl}" id="img-${i}" alt="Movie Scene" />
                </div>
                <div class="action-btns">
                    <button onclick="togglePlay(${i})">▶/⏸ Play/Pause</button>
                    <button class="dl-btn" onclick="downloadMedia('${mediaUrl}', ${i + 1})">📥 Download Shot</button>
                </div>
            `;
            gallery.prepend(card);

            await new Promise(resolve => setTimeout(resolve, 2500));
        }

        updateStatus(isRunning ? 'सभी सीन्स तैयार हैं! नीचे Play या Download बटन दबाएँ।' : 'प्रोसेस रोक दिया गया');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        isRunning = false;
    }

    function togglePlay(index) {
        const box = document.getElementById(`box-${index}`);
        box.classList.toggle('playing');
    }

    async function downloadMedia(url, sceneNum) {
        try {
            updateStatus(`Shot ${sceneNum} डाउनलोड हो रहा है...`);
            const response = await fetch(url);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `CineAI_Scene_${sceneNum}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            updateStatus(`Shot ${sceneNum} सफलतापूर्वक डाउनलोड हो गया!`);
        } catch (err) {
            window.open(url, '_blank');
            updateStatus('डाउनलोड शुरू हो गया है');
        }
    }

    function stopMovie() {
        isRunning = false;
        updateStatus('रोका जा रहा है...');
    }

    function updateStatus(msg) {
        document.getElementById('statusText').innerText = msg;
    }
</script>

</body>
</html>
