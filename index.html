<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine AI Studio</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        input {
            background: #0d1117;
            color: #fff;
            border: 1px solid #30363d;
        }
        button {
            background: #238636;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #2ea043;
        }
        #progress-bar {
            width: 100%;
            background: #30363d;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        #progress {
            width: 0%;
            height: 10px;
            background: #58a6ff;
            transition: width 0.4s ease;
        }
        #log {
            text-align: left;
            background: #0d1117;
            padding: 10px;
            border-radius: 5px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Cine AI Studio</h2>
        <p id="current-model">Engine #1 (Active Free)</p>
        
        <input type="text" id="promptInput" placeholder="अपना प्रॉम्प्ट यहाँ लिखें (जैसे: Action cinematic scene)...">
        <button onclick="startStudio()">लाइव जनरेशन शुरू करें</button>

        <div id="progress-bar">
            <div id="progress"></div>
        </div>

        <h3>Status Log:</h3>
        <div id="log"></div>
    </div>

    <script>
        let currentEngine = 1;
        const totalEngines = 80; // आपके 80+ मॉडल्स का पूल

        function logMessage(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function startStudio() {
            const promptText = document.getElementById('promptInput').value.trim();
            if (!promptText) {
                alert("कृपया पहले कुछ टेक्स्ट या प्रॉम्प्ट लिखें!");
                return;
            }
            document.getElementById('progress').style.width = "10%",
            logMessage("सिनेमैटिक पाइपलाइन शुरू हो रही है...");
            runLivePipeline(1, encodeURIComponent(promptText));
        }

        function runLivePipeline(step, encodedPrompt) {
            if (step > 5) {
                logMessage("=== Full Cinematic Sequence Rendered Successfully! ===");
                document.getElementById('progress').style.width = "100%";
                return;
            }
            
            document.getElementById('current-model').innerText = "Engine #" + currentEngine + " (Active Free)";
            logMessage(`कोशिश की जा रही है Engine #${currentEngine} के साथ (Step ${step})...`);

            // यहाँ हम Pollinations AI या API को कॉल कर रहे हैं
            fetch(`https://text.pollinations.ai/${encodedPrompt}?model=openai`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Engine #${currentEngine} Rate Limit Hit`);
                    }
                    return response.text();
                })
                .then(data => {
                    logMessage(`सफलता! Engine #${currentEngine} ने काम कर दिया।`);
                    document.getElementById('progress').style.width = (step * 20) + "%";
                    
                    // अगला स्टेप चलाएं
                    setTimeout(() => {
                        runLivePipeline(step + 1, encodedPrompt);
                    }, 1000);
                })
                .catch(error => {
                    // **यह ऑटोमैटिक फेलओवर लूप है:** जैसे ही लिमिट खत्म होगी, यह बिना रुके तुरंत अगले इंजन पर कूद जाएगा!
                    logMessage(`⚠️ Engine #${currentEngine} की लिमिट खत्म, अगले इंजन पर स्विच हो रहे हैं...`);
                    
                    currentEngine++;
                    if (currentEngine > totalEngines) {
                        currentEngine = 1; // 80 के बाद वापस पहले इंजन पर साइकल घूम जाएगी
                    }

                    // तुरंत बिना ऐप रोके अगले इंजन से प्रयास करेगा
                    setTimeout(() => {
                        runLivePipeline(step, encodedPrompt);
                    }, 500);
                });
        }
    </script>
</body>
</html>
