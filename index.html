<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAI Master - Real AI Movie Generator</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 15px; }
        .box { background: #1e293b; padding: 15px; border-radius: 8px; }
        textarea, input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        video { width: 100%; margin-top: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>CineAI Master 🎬 (Real Video Engine)</h2>
    
    <label>अपनी Replicate / HuggingFace API Key डालें:</label>
    <input type="password" id="apiKey" placeholder="r8_*********************" />

    <label>मूवी का सीन प्रॉम्ट लिखें:</label>
    <textarea id="prompt" placeholder="Laila mid-air roundhouse kick in neon alleyway..."></textarea>

    <button onclick="generateRealMovie()">असली AI वीडियो जनरेट करें</button>

    <div id="status" style="margin-top:10px; font-size:12px; text-align:center;"></div>
    
    <video id="videoPlayer" controls autoplay loop></video>
</div>

<script>
    async function generateRealMovie() {
        const key = document.getElementById('apiKey').value.trim();
        const prompt = document.getElementById('prompt').value.trim();
        const status = document.getElementById('status');
        const player = document.getElementById('videoPlayer');

        if (!key || !prompt) {
            alert('कृपया API Key और Prompt दोनों दर्ज करें!');
            return;
        }

        status.innerText = 'AI सर्वर पर वीडियो रेंडर हो रहा है... (इसमें 1-2 मिनट लग सकते हैं)';
        player.style.display = 'none';

        try {
            // Replicate Video Generation API Call
            const response = await fetch("https://api.replicate.com/v1/predictions", {
                method: "POST",
                headers: {
                    "Authorization": `Token ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    version: "luma/ray", // Or zero-scope / stabilityai video models
                    input: { prompt: prompt }
                })
            });

            const data = await response.json();
            status.innerText = 'वीडियो रेंडरिंग शुरू हो गई है, थोड़ा इंतजार करें...';
            
            // Polling for video completion
            setTimeout(() => {
                if(data.output) {
                    player.src = data.output;
                    player.style.display = 'block';
                    status.innerText = 'आपकी AI मूवी तैयार है!';
                }
            }, 30000);

        } catch (err) {
            status.innerText = 'एरर: API Key जांचें या सर्वर लोड देखें।';
        }
    }
</script>

</body>
</html>
