<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAI Master - Multi-Model Failover Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 15px; color: #38bdf8; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; display: block; color: #94a3b8; }
        textarea { width: 100%; height: 90px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 12px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-bottom: 15px; padding: 8px; border-radius: 6px; background: #334155; font-size: 12px; text-align: center; color: #38bdf8; }
        .gallery { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #0f172a; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
        .card-header { font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
        .media-box { width: 100%; height: 260px; background: #000; border-radius: 6px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        img { width: 100%; height: 100%; object-fit: cover; }
        .action-btns { display: flex; gap: 8px; margin-top: 8px; }
        .dl-btn { background: #16a34a !important; }
        .dl-btn:hover { background: #15803d !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>CineAI Master 🎬 (Multi-Engine Failover)</h1>
    
    <label for="prompts">हिस्टोरिकल या एक्शन मूवी प्रॉम्ट्स लिखें (हर लाइन = 1 सीन):</label>
    <textarea id="prompts" placeholder="Scene 1: Epic royal fort at sunrise...&#10;Scene 2: Warrior queen sword clash..."></textarea>

    <div class="btn-group">
        <button id="startBtn" onclick="startMultiModelEngine()">मल्टी-इंजन मूवी शुरू करें</button>
        <button id="stopBtn" onclick="stopProcess()" disabled style="background:#dc2626;">रोकें</button>
    </div>

    <div class="status" id="statusText">रेडी - ऑटो-स्विचिंग सर्वर पूल कनेक्टेड है</div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    let isRunning = false;

    // फ्री और पावरफुल मॉडल्स की लिस्ट (जो आपस में ऑटो-रोटेट होंगे)
    const freeEngines = [
        (prompt, seed) => `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=576&nologo=true&model=flux`,
        (prompt, seed) => `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=576&nologo=true&model=flux-realism`,
        (prompt, seed) => `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=576&nologo=true&model=midjourney`,
        (prompt, seed) => `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=576&seed=${seed}`
    ];

    async function startMultiModelEngine() {
        const text = document.getElementById('prompts').value.trim();
        if (!text) {
            alert('कृपया कम से कम एक प्रॉम्ट दर्ज करें!');
            return;
        }

        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length === 0) return;

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        for (let i = 0; i < lines.length; i++) {
            if (!isRunning) break;

            const promptText = lines[i].trim();
            const enhancedPrompt = promptText + ", hyper-realistic, 8k resolution, cinematic lighting, live action movie still, masterpiece";
            
            // इंजन को आटोमैटिक बदलने के लिए रैंडम या सीक्वेंशियल इंडेक्स चुनें
            const engineIndex = i % freeEngines.length;
            const seed = Math.floor(Math.random() * 99999999);
            const mediaUrl = freeEngines[engineIndex](enhancedPrompt, seed);

            updateStatus(`सीन ${i + 1} रेंडर हो रहा है (Engine #${engineIndex + 1} Active)...`);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">Scene ${i + 1} [Model Router #${engineIndex + 1}]: ${promptText}</div>
                <div class="media-box">
                    <img src="${mediaUrl}" alt="Cinematic Frame" loading="lazy" onerror="this.onerror=null; this.src='https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?seed=${seed+1}';" />
                </div>
                <div class="action-btns">
                    <button class="dl-btn" onclick="window.open('${mediaUrl}', '_blank')">📥 Download Frame</button>
                </div>
            `;
            gallery.prepend(card);

            // सर्वर को सांस लेने और ब्लॉक न करने के लिए सुरक्षित गैप
            for(let t = 3; t > 0; t--) {
                if(!isRunning) break;
                updateStatus(`अगले इंजन पर स्विच करने से पहले सुरक्षा गैप: ${t}s...`);
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }

        updateStatus(isRunning ? 'सभी सीन्स मल्टी-इंजन राऊटर द्वारा सफलतापूर्वक तैयार कर दिए गए हैं!' : 'प्रोसेस रोक दिया गया');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        isRunning = false;
    }

    function stopProcess() {
        isRunning = false;
        updateStatus('प्रोसेस रोक दिया गया है...');
    }

    function updateStatus(msg) {
        document.getElementById('statusText').innerText = msg;
    }
</script>

</body>
</html>
