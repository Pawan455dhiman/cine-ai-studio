<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine AI Studio</title>
    <style>
        :root {
            --bg-color: #0f0f15;
            --card-bg: #1a1a24;
            --accent-color: #ff3366;
            --text-color: #ffffff;
            --subtext-color: #a0a0b0;
        }
        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a38;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .nav-btn {
            background: #2a2a38;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        .tab-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid #2a2a38;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }
        .tab.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }
        .input-box {
            position: relative;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: var(--card-bg);
            border: 1px solid #2a2a38;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
            resize: none;
        }
        .mic-btn {
            position: absolute;
            right: 10px;
            bottom: 15px;
            background: var(--accent-color);
            border: none;
            color: white;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff3366, #ff6633);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a2a38;
        }
        .model-badge {
            display: inline-block;
            background: #00c853;
            color: black;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🎬 CINE AI STUDIO</div>
        <div>
            <button class="nav-btn">📜 History</button>
            <button class="nav-btn">⚙️ Settings</button>
        </div>
    </div>

    <div class="tab-group">
        <button class="tab active">Text to Video</button>
        <button class="tab">Photo to Video</button>
    </div>

    <div class="input-box">
        <textarea id="prompt" placeholder="अपनी फिल्म का सीन या प्रॉम्प्ट यहाँ लिखें या माइक से बोलें..."></textarea>
        <button class="mic-btn" onclick="startDictation()">🎤</button>
    </div>

    <button class="action-btn">🚀 Generate Scene</button>

    <div class="status-card">
        <div><strong>Active Model:</strong> <span class="model-badge">Engine #1 Ready</span></div>
        <p style="font-size: 12px; color: var(--subtext-color); margin-top: 8px;">
            Auto-Switching System: 80 AI models active for unlimited video creation.
        </p>
    </div>

    <script>
        function startDictation() {
            if (window.hasOwnProperty('webkitSpeechRecognition')) {
                var recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "hi-IN";
                recognition.start();
                recognition.onresult = function(e) {
                    document.getElementById('prompt').value += e.results[0][0].transcript;
                    recognition.stop();
                };
            } else {
                alert("आपके ब्राउज़र/फोन में वॉइस टाइपिंग सपोर्ट नहीं है।");
            }
        }
    </script>
</body>
</html>
