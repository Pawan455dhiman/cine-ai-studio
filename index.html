<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAI Master - Movie Automation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 15px; color: #38bdf8; }
        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block; color: #94a3b8; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 15px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-bottom: 15px; padding: 10px; border-radius: 6px; background: #334155; font-size: 13px; text-align: center; }
        .gallery { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #0f172a; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
        .card-header { font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
        .movie-screen { width: 100%; height: 300px; background: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .movie-screen img { width: 100%; height: 100%; object-fit: cover; animation: cinematicZoom 5s infinite alternate; }
        @keyframes cinematicZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CineAI Master 🎬 (Movie Mode)</h1>
    
    <label for="prompts">मूवी शॉट्स (हर लाइन में 1 सीक्वेंस लिखें):</label>
    <textarea id="prompts" placeholder="Shot 1: Neon alleyway rain night&#10;Shot 2: Laila kicks guard in mid-air&#10;Shot 3: Smoke screen from pipe..."></textarea>

    <div class="btn-group">
        <button id="startBtn" onclick="startMovieAutomation()">मूवी सीक्वेंस चलाएं</button>
        <button id="stopBtn" onclick="stopMovie()" disabled style="background:#dc2626;">रोकें</button>
    </div>

    <div class="status" id="statusText">रेडी - मूवी ऑटोमेशन के लिए प्रॉम्ट डालें</div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    let isRunning = false;

    async function startMovieAutomation() {
        const text = document.getElementById('prompts').value.trim();
        if (!text) {
            alert('कृपया कम से कम एक प्रॉम्ट दर्ज करें!');
            return;
        }

        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length === 0) return;

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        for (let i = 0; i < lines.length; i++) {
            if (!isRunning) break;

            const promptText = lines[i].trim();
            updateStatus(`मूवी फ्रेम रेंडर हो रहा है: Shot ${i + 1} of ${lines.length}`);

            const seed = Math.floor(Math.random() * 999999);
            // High quality cinematic frame generation with motion styling
            const frameUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText + ", cinematic action movie still, professional color grading, 4k")}?seed=${seed}&width=1280&height=720&nologo=true`;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">Scene ${i + 1}: ${promptText}</div>
                <div class="movie-screen">
                    <img src="${frameUrl}" alt="Movie Frame" />
                </div>
            `;
            gallery.prepend(card);

            // Cinematic delay per shot to mimic video playback flow
            await new Promise(resolve => setTimeout(resolve, 3000));
        }

        updateStatus(isRunning ? 'मूवी सीक्वेंस तैयार है!' : 'प्रोसेस रोक दिया गया');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        isRunning = false;
    }

    function stopMovie() {
        isRunning = false;
        updateStatus('रोका जा रहा है...');
    }

    function updateStatus(msg) {
        document.getElementById('statusText').innerText = msg;
    }
</script>

</body>
</html>
