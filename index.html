<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine AI Studio - Ultimate Motion Video Engine</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 750px;
            margin: 20px auto;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 5px;
        }
        #current-status {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 15px;
        }
        textarea, input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-size: 15px;
            outline: none;
        }
        textarea {
            background: #0d1117;
            color: #fff;
            resize: vertical;
            height: 80px;
        }
        button {
            background: #238636;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        #progress-bar {
            width: 100%;
            background: #0d1117;
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
            border: 1px solid #30363d;
        }
        #progress {
            width: 0%;
            height: 12px;
            background: #238636;
            transition: width 0.3s ease;
        }
        #media-output {
            margin: 20px 0;
            padding: 15px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* सिनेमैटिक मोशन वीडियो कैनवास */
        #cineCanvas {
            max-width: 100%;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.7);
            background: #000;
        }
        #log {
            text-align: left;
            background: #0d1117;
            padding: 12px;
            border-radius: 6px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Cine AI Studio (Motion Video Engine)</h2>
        <p id="current-status">Ready to render long-form cinematic scenes & motion video</p>
        
        <textarea id="promptInput" placeholder="वेब सीरीज़ का प्रॉम्प्ट लिखें (जैसे: Epic Arabian queen battling a blue jinn, cinematic lighting, 4K)..."></textarea>
        <button onclick="startUltimatePipeline()">🔥 धमाकेदार सिनेमैटिक वीडियो रेंडर शुरू करें</button>

        <div id="progress-bar">
            <div id="progress"></div>
        </div>

        <!-- लाइव वीडियो एनीमेशन प्लेयर -->
        <div id="media-output">
            <p id="placeholder-text" style="color: #8b949e; margin: 0;">यहाँ आपका लाइव सिनेमैटिक मोशन वीडियो रेंडर होकर प्ले होगा...</p>
            <canvas id="cineCanvas" width="960" height="540" style="display:none;"></canvas>
            <div id="download-box" style="margin-top: 12px;"></div>
        </div>

        <div style="text-align: left; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #8b949e;">Live Engine Rotation & Render Log:</div>
        <div id="log"></div>
    </div>

    <script>
        let currentEngine = 1;
        const totalEngines = 80; // 80 मॉडल्स का ऑटो-रोटेशन पूल
        const totalScenes = 10;  // 10 सीन्स की लंबी सीरीज़ पाइपलाइन
        let animationId = null;

        function logMessage(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function startUltimatePipeline() {
            const promptText = document.getElementById('promptInput').value.trim();
            if (!promptText) {
                alert("कृपया पहले सीरीज़ का प्रॉम्प्ट लिखें!");
                return;
            }
            document.getElementById('log').innerHTML = "";
            document.getElementById('progress').style.width = "2%";
            document.getElementById('placeholder-text').style.display = "none";
            document.getElementById('cineCanvas').style.display = "block";
            logMessage("अल्टीमेट सिनेमैटिक मोशन वीडियो पाइपलाइन शुरू हो रही है...");
            renderScene(1, promptText);
        }

        function playMotionVideo(imgObj, sceneNum) {
            const canvas = document.getElementById('cineCanvas');
            const ctx = canvas.getContext('2d');
            let scale = 1.0;
            let step = 0.0015;

            if (animationId) cancelAnimationFrame(animationId);

            function animate() {
                scale += step;
                if (scale > 1.15 || scale < 1.0) step = -step;

                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(scale, scale);
                ctx.drawImage(imgObj, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                ctx.restore();

                // सिनेमैटिक सीन टाइटल ओवरले
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(20, 20, 240, 40);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 18px Arial";
                ctx.fillText(`🎬 SCENE PART #${sceneNum}`, 35, 46);

                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function renderScene(sceneNum, basePrompt) {
            if (sceneNum > totalScenes) {
                logMessage("=== 🎉 पूरी वेब सीरीज़ का मोशन वीडियो सीक्वेंस सफलतापूर्वक तैयार हो गया है! ===");
                document.getElementById('progress').style.width = "100%";
                document.getElementById('current-status').innerText = "Ultimate Series Motion Render Complete!";
                return;
            }

            let progressPercent = (sceneNum / totalScenes) * 100;
            document.getElementById('progress').style.width = progressPercent + "%";
            document.getElementById('current-status').innerText = `Rendering Scene ${sceneNum}/${totalScenes} using Engine #${currentEngine}`;
            
            logMessage(`▶️ Scene ${sceneNum} की कोशिश जारी है: Engine #${currentEngine}...`);

            const scenePrompt = `${basePrompt} - Scene Part ${sceneNum} of ${totalScenes}, Cinematic motion film style, highly detailed 8K`;
            const encoded = encodeURIComponent(scenePrompt);

            // API कॉल with current engine rotation
            fetch(`https://text.pollinations.ai/${encoded}?model=openai&seed=${currentEngine * sceneNum}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Engine #${currentEngine} Rate Limit Hit`);
                    }
                    return response.text();
                })
                .then(data => {
                    logMessage(`✅ सफलता! Scene ${sceneNum} को Engine #${currentEngine} ने प्रोसेस कर दिया।`);
                    
                    const imageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=576&seed=${currentEngine * sceneNum}&nologo=true`;
                    
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = imageUrl;
                    img.onload = function() {
                        // लाइव मोशन एनीमेशन स्टार्ट करें
                        playMotionVideo(img, sceneNum);

                        // डाउनलोड बटन अपडेट करें
                        const downloadBox = document.getElementById('download-box');
                        downloadBox.innerHTML = `
                            <p style="color: #3fb950; font-weight: bold; margin-bottom: 6px;">✨ Scene ${sceneNum} Motion Video Ready!</p>
                            <button onclick="downloadMedia('${imageUrl}', 'Scene_${sceneNum}_Cinematic.jpg')" style="width: auto; padding: 8px 18px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">📥 Download Scene ${sceneNum} Media File</button>
                        `;

                        // अगले सीन पर ऑटोमैटिक बढ़ना
                        setTimeout(() => {
                            renderScene(sceneNum + 1, basePrompt);
                        }, 2500);
                    };
                })
                .catch(error => {
                    // **ऑटोमैटिक फेलओवर लूप:** जैसे ही लिमिट खत्म होगी, बिना रुके तुरंत अगले इंजन पर कूद जाएगा!
                    logMessage(`⚠️ Engine #${currentEngine} की लिमिट खत्म! तुरंत अगले इंजन पर कूद रहे हैं...`);
                    
                    currentEngine++;
                    if (currentEngine > totalEngines) {
                        currentEngine = 1; // 80 के बाद वापस पहले इंजन से साइकिल घुमाएगा
                    }

                    // बिना रुके उसी सीन को नए इंजन से दोबारा ट्राई करेगा
                    setTimeout(() => {
                        renderScene(sceneNum, basePrompt);
                    }, 300);
                });
        }

        // सेफ डायरेक्ट डाउनलोड फंक्शन (Blob method)
        function downloadMedia(url, filename) {
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(err => {
                    window.open(url, '_blank');
                });
        }
    </script>
</body>
</html>
