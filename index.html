<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAI Master - Autonomous AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 15px; color: #38bdf8; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; display: block; color: #94a3b8; }
        textarea { width: 100%; height: 90px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 12px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-bottom: 15px; padding: 8px; border-radius: 6px; background: #334155; font-size: 12px; text-align: center; }
        .gallery { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #0f172a; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
        .card-header { font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
        .media-box { width: 100%; height: 260px; background: #000; border-radius: 6px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        video, img { width: 100%; height: 100%; object-fit: cover; }
        .action-btns { display: flex; gap: 8px; margin-top: 8px; }
        .dl-btn { background: #16a34a !important; }
        .dl-btn:hover { background: #15803d !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>CineAI Master 🎬 (Autonomous AI)</h1>
    
    <label for="prompts">हिस्टोरिकल या एक्शन मूवी प्रॉम्ट्स लिखें (हर लाइन = 1 सीन):</label>
    <textarea id="prompts" placeholder="Scene 1: Epic royal fort at sunrise, 35mm cinematic...&#10;Scene 2: Fearless warrior queen armor sword clash..."></textarea>

    <div class="btn-group">
        <button id="startBtn" onclick="generateCinematicAI()">AI मूवी जनरेट करें</button>
        <button id="stopBtn" onclick="stopProcess()" disabled style="background:#dc2626;">रोकें</button>
    </div>

    <div class="status" id="statusText">रेडी - ऑटोमैटिक इंजन कनेक्टेड है</div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    let isRunning = false;

    async function generateCinematicAI() {
        const text = document.getElementById('prompts').value.trim();
        if (!text) {
            alert('कृपया कम से कम एक प्रॉम्ट दर्ज करें!');
            return;
        }

        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length === 0) return;

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        for (let i = 0; i < lines.length; i++) {
            if (!isRunning) break;

            const promptText = lines[i].trim();
            updateStatus(`सीन ${i + 1} रेंडर हो रहा है (AI Video Engine Active)...`);

            const seed = Math.floor(Math.random() * 999999);
            const mediaUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText + ", photorealistic, 8k resolution, cinematic lighting, live action movie still, highly detailed face, 35mm lens")}?seed=${seed}&width=1280&height=720&nologo=true&model=flux`;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">Scene ${i + 1}: ${promptText}</div>
                <div class="media-box">
                    <img src="${mediaUrl}" alt="Cinematic Frame" />
                </div>
                <div class="action-btns">
                    <button class="dl-btn" onclick="window.open('${mediaUrl}', '_blank')">📥 Download Frame/Video</button>
                </div>
            `;
            gallery.prepend(card);

            await new Promise(resolve => setTimeout(resolve, 2000));
        }

        updateStatus(isRunning ? 'हिस्टोरिकल सिनेमैटिक मूवी सीन्स तैयार हैं!' : 'प्रोसेस रोक दिया गया');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        isRunning = false;
    }

    function stopProcess() {
        isRunning = false;
        updateStatus('रोका जा रहा है...');
    }

    function updateStatus(msg) {
        document.getElementById('statusText').innerText = msg;
    }
</script>

</body>
</html>
